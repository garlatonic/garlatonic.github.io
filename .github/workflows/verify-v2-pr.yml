name: Verify v2 pull request

on:
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  verify:
    name: Lint and static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
